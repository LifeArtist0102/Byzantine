[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byzantine"
version = "0.2.0"
description = "Local evidence-grounded Byzantine history research agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "docling>=2.0",
    "pypdf>=5.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "typer>=0.15",
    "platformdirs>=4.3",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
rag = [
    "llama-index-core>=0.12",
    "llama-index-vector-stores-qdrant>=0.6",
    "qdrant-client>=1.13",
    "FlagEmbedding>=1.3",
    "sentence-transformers>=3,<6",
    "transformers>=4.44,<5",
]
app = [
    "streamlit>=1.42",
]
generation = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]
ocr = ["paddleocr>=2.9", "paddlepaddle>=3.0"]
local = [
    "qdrant-client>=1.13",
    "FlagEmbedding>=1.3",
    "sentence-transformers>=3,<6",
    "transformers>=4.44,<5",
    "streamlit>=1.42",
    "openai>=1.0",
    "python-dotenv>=1.0",
]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
byzantine-ingest = "byzantine.ingestion.cli:app"
byzantine-chunk = "byzantine.chunking.cli:app"
byzantine-enrich = "byzantine.metadata.cli:app"
byzantine-index = "byzantine.indexing.cli:app"
byzantine-download-model = "byzantine.indexing.download_model:app"
byzantine-search = "byzantine.retrieval.cli:app"
byzantine-ask = "byzantine.workflows.ask_cli:app"
byzantine-app = "byzantine.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Typer's documented CLI signature uses Option/Argument calls as defaults.
ignore = ["B008"]
