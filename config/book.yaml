# Compatibility configuration for the legacy command-line pipeline only.
# The Streamlit multi-document application stores bibliography and processing
# state per document in SQLite; it does not use this file.
book_id: legacy_single_document
title: Local legacy source document
language: en
edition: Local PDF edition
source_pdf: null

chunking:
  target_characters: 2400
  min_characters: 700
  max_characters: 3600
  overlap_characters: 250

quality_gate:
  min_extracted_characters_per_text_page: 120
  max_blank_page_ratio: 0.08

metadata:
  historical_year_min: 200
  historical_year_max: 1500

embedding:
  model_name: BAAI/bge-m3
  local_model_path: models/bge-m3
  max_length: 2048
  batch_size_cpu: 2
  # Existing legacy CLI index. The Streamlit multi-document app uses its own
  # byzantine_library_v1 collection under APP_DATA/qdrant.
  collection_name: byzantine_bge_m3_v1

generation:
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-chat
  temperature: 0.1
  max_output_tokens: 1200
  max_evidence_characters: 2200
