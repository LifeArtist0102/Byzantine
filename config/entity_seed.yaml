# Conservative, reviewed aliases. Add an alias only when it has an unambiguous
# canonical form; the enrichment command writes unresolved name-like strings to
# person_candidates rather than treating them as historical facts.
people:
  - canonical: Basil II
    aliases: ["Basil II", "Basil II Bulgaroktonos"]
  - canonical: Alexios I Komnenos
    aliases: ["Alexios I", "Alexios I Komnenos"]
  - canonical: Justinian I
    aliases: ["Justinian", "Justinian I"]
  - canonical: Herakleios
    aliases: ["Herakleios", "Heraclius"]
  - canonical: Constantine VII Porphyrogenitus
    aliases: ["Constantine VII", "Constantine VII Porphyrogenitus"]
  - canonical: Michael VIII Palaiologos
    aliases: ["Michael VIII", "Michael VIII Palaiologos"]
  - canonical: Anna Komnene
    aliases: ["Anna Komnene"]
  - canonical: Nikephoros II Phokas
    aliases: ["Nikephoros II", "Nikephoros II Phokas"]
  - canonical: Romanos I Lekapenos
    aliases: ["Romanos I", "Romanos I Lekapenos"]
  - canonical: John I Tzimiskes
    aliases: ["John I Tzimiskes"]
  - canonical: Manuel I Komnenos
    aliases: ["Manuel I", "Manuel I Komnenos"]
  - canonical: Andronikos II Palaiologos
    aliases: ["Andronikos II", "Andronikos II Palaiologos"]
